# Underground DEV stack on the shared host (rules §8.1 — one command brings it up).
#
# Shape: db + api + web + admin, all on a private network, fronted by the shared Caddy on
# `caddynet`. No host ports are published — Caddy reaches the containers by name, so the
# database and the API are unreachable from the internet except through the routes Caddy
# exposes. Every URL/port/secret comes from deploy/.env.dev (never hardcoded — §10).
#
# Usage (from the repo root on the server):
#   docker compose --env-file deploy/.env.dev -f deploy/docker-compose.dev.yml up -d --build

name: underground-dev

services:
  db:
    image: postgres:16-alpine
    container_name: underground-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR}/pg:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../api
    image: underground-dev-api
    container_name: underground-dev-api
    restart: unless-stopped
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG}
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /app/uploads
      # Absolute URLs the API mints (upload links, password-reset links) must be the
      # PUBLIC ones, not the container names — they are opened in a browser or a phone.
      PUBLIC_BASE_URL: ${PUBLIC_API_URL}
      WEB_APP_URL: ${PUBLIC_WEB_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - ${DATA_DIR}/uploads:/app/uploads
    networks: [internal, caddynet]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL}
    image: underground-dev-web
    container_name: underground-dev-web
    restart: unless-stopped
    networks: [caddynet]
    depends_on: [api]

  admin:
    build:
      context: ../admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ADMIN_API_URL}
    image: underground-dev-admin
    container_name: underground-dev-admin
    restart: unless-stopped
    networks: [caddynet]
    depends_on: [api]

networks:
  internal:
  caddynet:
    external: true
