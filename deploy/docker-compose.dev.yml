# Underground DEV stack on the shared arm64 box 65.108.87.247 (rules §6: one command brings it up).
#
# Images are NOT built here: CI builds them for the exact commit on an arm64 runner, and
# deploy/deploy-dev.sh loads them onto the box and sets UG_TAG (= that commit) in release.env.
# Nothing compiles on the box, which also serves LIVE products.
#
# Shape: db + api + web + admin. No host ports are published; the shared Caddy (network `caddynet`)
# reaches the containers by name. Memory limits keep this stand from starving the LIVE neighbours.
#
# Usage on the box (deploy-dev.sh runs exactly this):
#   cd /opt/underground-dev && docker compose --env-file .env.dev --env-file release.env \
#     -f docker-compose.dev.yml up -d --wait

name: underground-dev

# Bounded logs for every service, and CPU caps that sum to 1.5 of the box's 2 vCPUs (db 0.5, api 0.5, web 0.25,
# admin 0.25) with a low CPU weight, so the LIVE products sharing the box win any contention.
x-limits: &limits
  restart: unless-stopped
  cpu_shares: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    container_name: underground-dev-db
    <<: *limits
    cpus: "0.5"
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # create_host_path false: pg/ exists only on the mounted 4 GB data fs (bootstrap-dev.sh). If that mount is
      # missing, the container refuses to start instead of silently writing to the disk LIVE products share.
      - type: bind
        source: ${DATA_DIR}/pg
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: underground-api:${UG_TAG:?set by deploy-dev.sh in release.env}
    container_name: underground-dev-api
    <<: *limits
    cpus: "0.5"
    mem_limit: 256m
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG}
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /app/uploads
      # Absolute URLs the API mints (uploads, links in mail) must be the PUBLIC ones.
      PUBLIC_BASE_URL: ${PUBLIC_WEB_URL}
      WEB_APP_URL: ${PUBLIC_WEB_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - type: bind
        source: ${DATA_DIR}/uploads
        target: /app/uploads
        bind: { create_host_path: false }
    networks: [internal, caddynet]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: underground-web:${UG_TAG:?set by deploy-dev.sh in release.env}
    container_name: underground-dev-web
    <<: *limits
    cpus: "0.25"
    mem_limit: 256m
    networks: [caddynet]
    depends_on: [api]

  admin:
    image: underground-admin:${UG_TAG:?set by deploy-dev.sh in release.env}
    container_name: underground-dev-admin
    <<: *limits
    cpus: "0.25"
    mem_limit: 192m
    networks: [caddynet]
    depends_on: [api]

networks:
  internal:
  caddynet:
    external: true
