# cargo audit exceptions. Each one is UNREACHABLE, not waived (rules §6): the crate sits in Cargo.lock only
# because sqlx 0.8's macro crate lists every driver behind optional features, so lockfile resolution includes
# sqlx-mysql (rsa) and sqlx-sqlite (libsqlite3-sys) although this crate enables only "postgres" and neither is
# compiled. Evidence is a CI gate, not a claim: the api job fails if `cargo tree -i <crate>` ever finds either
# in the real build graph (.github/workflows/ci.yml, step "Unreachable advisories stay unreachable").
# Review by 2027-02-12 or on the next sqlx upgrade, whichever is first.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa 0.9 Marvin timing attack — via sqlx-mysql, not compiled
  "RUSTSEC-2026-0459", # libsqlite3-sys / C SQLite CVE — via sqlx-sqlite, not compiled
]
