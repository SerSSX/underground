[package]
name = "underground-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "underground_api"
path = "src/lib.rs"

[[bin]]
name = "underground-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone validation for the event_timezone contract (TASK-102 / BR-020).
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
async-trait = "0.1"
# Lemon Squeezy webhook signature verification (HMAC-SHA256).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Outbound HTTPS to the OpenStreetMap geocoder (TASK-303 G1): rustls + webpki roots (both
# already in the tree via sqlx), no system proxy, no native TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Point → IANA time zone (TASK-303 G1 fix batch). Code MIT; the bundled boundary data (tzf-dist)
# is MIT AND ODbL-1.0, from OpenStreetMap: owner accepted ODbL on 2026-11-13 (docs/decisions.md).
tzf-rs = { version = "2.3", default-features = false, features = ["bundled"] }
# Uploaded images (TASK-304): decode JPEG/PNG/WebP in pure Rust (zune-jpeg, png, image-webp), resize,
# drop metadata. MIT OR Apache-2.0. No default features: only the three decoders, no rayon.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Lossy WebP ENCODING of our own decoded pixels via libwebp (vendored C, BSD-3-Clause; crate MIT OR
# Apache-2.0, libwebp-sys MIT). Untrusted bytes are never handed to libwebp: decoding is image's Rust code.
webp = { version = "0.3", default-features = false }
# NFC for the event city compare (TASK-303 N2). Already in the tree via sqlx's stringprep; MIT OR Apache-2.0.
unicode-normalization = "0.1"
# setrlimit for the image-decoding child process (TASK-304 review). Already in the tree; MIT OR Apache-2.0.
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# A request body that stalls, for the upload-deadline test (already in the tree via axum).
futures-util = "0.3"

[profile.release]
opt-level = 3
# Fat LTO + codegen-units=1 OOMs the 2 GiB colima build VM (SIGKILL during final rustc).
# This API is I/O-bound (Postgres), so the runtime delta from dropping LTO is negligible while
# the build now fits in 2 GiB. Bump colima memory + restore fat LTO if a perf-critical need arises.
lto = false
codegen-units = 16
